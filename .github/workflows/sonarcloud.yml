# Quality gate do SonarCloud (gratuito para repo público). Precisa do secret SONAR_TOKEN.
# PRs de fork não recebem secrets: o job é pulado neles.
# Só roda com a variável SONAR_ENABLED=true (gh variable set SONAR_ENABLED --body true), depois do SONAR_TOKEN.
# Sem isso o job fica "skipped" em vez de vermelho, e o repoyard não confunde falta de configuração com código quebrado.
name: sonarcloud

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: SonarCloud
    if: vars.SONAR_ENABLED == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
