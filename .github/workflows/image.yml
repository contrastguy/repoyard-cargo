# Na main: publica ghcr.io/<owner>/repoyard-cargo:sha-<curto> e atualiza deploy/ (o Argo CD sincroniza).
# O commit de bump leva [skip ci] (nenhum workflow roda nele) e é feito pela deploy key DEPLOY_KEY.
name: image

on:
  push:
    branches: [main]
    paths-ignore: ['deploy/**']

permissions:
  contents: read
  packages: write

concurrency:
  group: image-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Checkout pela deploy key: é a única identidade com bypass no ruleset da main (para o commit de bump).
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
      - id: tag
        run: echo "short=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/repoyard-cargo:${{ steps.tag.outputs.short }}
      - name: Bump deploy/
        env:
          TAG: ${{ steps.tag.outputs.short }}
        run: |
          sed -i "s/^\(\s*newTag:\s*\).*/\1${TAG}/" deploy/kustomization.yaml
          sed -i "s/^\(\s*- GIT_SHA=\).*/\1${GITHUB_SHA}/" deploy/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deploy): bump image ${TAG} [skip ci]"
          git push
