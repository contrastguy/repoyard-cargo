apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cargo
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
images:
  - name: cargo
    newName: ghcr.io/contrastguy/repoyard-cargo
    newTag: sha-0000000
configMapGenerator:
  - name: cargo-version
    literals:
      - GIT_SHA=0000000000000000000000000000000000000000
